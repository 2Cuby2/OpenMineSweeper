name: Lint and type check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install node modules 
        run: npm install

      - name: 🧪 Lint
        run: npm run lint
